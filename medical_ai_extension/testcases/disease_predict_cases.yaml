- case_id: DP_001
  case_name: "疾病风险预测-正常输入"
  method: POST
  path: "/api/v1/predict/disease-risk"
  request:
    patient_id: "TEST_P001"
    age: 58
    gender: "male"
    diagnosis_history:
      - "hypertension"
    lab_tests:
      glucose: 8.2
      hba1c: 6.9
      cholesterol: 5.8
    vital_signs:
      systolic_bp: 145
      diastolic_bp: 92
      heart_rate: 86
  expected:
    status_code: 200
    required_fields:
      - "request_id"
      - "model_name"
      - "model_version"
      - "result.risk_level"
      - "result.probability"
    probability_path: "result.probability"
    probability_range: [0, 1]
    risk_level_path: "result.risk_level"
    allowed_risk_levels: ["low", "medium", "high"]

- case_id: DP_002
  case_name: "疾病风险预测-缺失年龄字段"
  method: POST
  path: "/api/v1/predict/disease-risk"
  request:
    patient_id: "TEST_P002"
    gender: "female"
    diagnosis_history:
      - "diabetes"
    lab_tests:
      glucose: 9.1
      hba1c: 7.4
    vital_signs:
      systolic_bp: 138
      diastolic_bp: 88
      heart_rate: 80
  expected:
    status_code: 400
    required_fields:
      - "error_code"
      - "message"
    message_contains: "age"

